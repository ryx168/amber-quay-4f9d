<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>愛爾蘭與英倫 11 天精華之遊 · 盛世公主號</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --gold: #f6c453; --gold2: #ffe49a; --red: #c8102e; --red2: #8c0b20; --navy: #0b1f4b; --ink: #1a1208;
        --white: #fff; --cream: #fff6dc;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000;
        font-family: "Noto Sans CJK TC", "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", "Microsoft YaHei", sans-serif; color: var(--white); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000; }
      .clip { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      #plate { object-fit: cover; }
      .num { font-variant-numeric: tabular-nums; }
      .gold-text { color: var(--gold2); text-shadow: 0 2px 0 #7a4b00, 0 6px 18px rgba(0,0,0,.7); }
      .stroke-red { color: #fff; -webkit-text-stroke: 0; text-shadow: 0 0 2px var(--red), 0 0 2px var(--red), 2px 2px 0 var(--red2), 0 8px 24px rgba(0,0,0,.8); }

      /* ---------- vignette + brand ---------- */
      .vignette { background: radial-gradient(ellipse at 50% 55%, rgba(0,0,0,0) 55%, rgba(0,0,0,.45) 100%); pointer-events: none; }
      .brand { left: 50px; top: 40px; width: auto; height: auto; display: flex; align-items: center; gap: 16px; opacity: 0; }
      .brand img { width: 92px; height: 92px; object-fit: contain; filter: drop-shadow(0 4px 10px rgba(0,0,0,.6)); }
      .brand .t1 { font-size: 30px; font-weight: 900; color: var(--gold2); text-shadow: 0 2px 8px rgba(0,0,0,.8); letter-spacing: .04em; }
      .brand .t2 { font-size: 18px; color: var(--cream); letter-spacing: .25em; text-shadow: 0 2px 8px rgba(0,0,0,.8); }

      /* ---------- cover ---------- */
      .cover { background: linear-gradient(90deg, rgba(5,12,40,.82) 0%, rgba(5,12,40,.55) 45%, rgba(5,12,40,.15) 100%); }
      .cover .ribbon { position: absolute; left: 90px; top: 150px; padding: 12px 34px; background: linear-gradient(90deg, var(--red2), var(--red)); color: var(--gold2); font-size: 34px; font-weight: 900; letter-spacing: .08em; border-radius: 6px; box-shadow: 0 10px 30px rgba(0,0,0,.6); opacity: 0; }
      .cover .ribbon b { color: #fff; font-size: 44px; margin: 0 6px; }
      .cover .h1 { position: absolute; left: 90px; top: 250px; font-size: 100px; font-weight: 900; line-height: 1.1; letter-spacing: .02em; opacity: 0; white-space: nowrap; }
      .cover .h1 .n { font-size: 128px; color: var(--gold2); }
      .cover .h2 { position: absolute; left: 96px; top: 420px; font-size: 44px; font-weight: 700; color: var(--cream); letter-spacing: .06em; text-shadow: 0 2px 10px rgba(0,0,0,.8); opacity: 0; }
      .cover .h2 span { color: var(--gold); margin-right: 14px; }
      .cover .pills { position: absolute; left: 96px; top: 520px; display: flex; gap: 14px; flex-wrap: wrap; width: 900px; opacity: 0; }
      .cover .pill { padding: 10px 24px; border: 2px solid var(--gold); border-radius: 999px; font-size: 30px; font-weight: 700; color: var(--gold2); background: rgba(0,0,0,.35); }
      .cover .date { position: absolute; left: 96px; top: 640px; font-size: 34px; color: var(--cream); letter-spacing: .08em; opacity: 0; }
      .cover .date b { color: var(--gold2); font-size: 42px; }
      .cover .host { position: absolute; right: 40px; bottom: 0; width: 700px; height: 700px; opacity: 0; }
      .cover .host img { position: absolute; right: 0; bottom: 0; height: 700px; filter: drop-shadow(0 20px 40px rgba(0,0,0,.6)); }
      .cover .host .tag { position: absolute; left: 20px; bottom: 100px; background: linear-gradient(90deg, var(--red2), var(--red)); color: #fff; padding: 14px 30px; border-radius: 8px; font-size: 34px; font-weight: 900; box-shadow: 0 10px 30px rgba(0,0,0,.6); white-space: nowrap; }
      .cover .host .tag small { display: block; font-size: 22px; font-weight: 500; color: var(--gold2); letter-spacing: .1em; }

      /* ---------- anniversary burst ---------- */
      .anniv { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 10px; padding-bottom: 120px; }
      .anniv .l1 { font-size: 110px; font-weight: 900; letter-spacing: .04em; opacity: 0; }
      .anniv .l2 { font-size: 96px; font-weight: 900; letter-spacing: .04em; opacity: 0; }

      /* ---------- includes ---------- */
      .includes { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 150px; gap: 40px; }
      .includes .row { display: flex; gap: 26px; }
      .includes .inc { padding: 18px 44px; border-radius: 16px; background: linear-gradient(180deg, rgba(200,16,46,.95), rgba(140,11,32,.95)); border: 3px solid var(--gold); font-size: 54px; font-weight: 900; color: var(--gold2); box-shadow: 0 16px 40px rgba(0,0,0,.6); opacity: 0; letter-spacing: .04em; }
      .includes .price { font-size: 64px; font-weight: 900; color: #fff; text-shadow: 0 4px 16px rgba(0,0,0,.8); opacity: 0; letter-spacing: .04em; }
      .includes .price b { font-size: 120px; color: var(--gold2); text-shadow: 0 3px 0 #7a4b00, 0 10px 30px rgba(0,0,0,.8); margin: 0 10px; }

      /* ---------- place label ---------- */
      .label { left: 60px; top: auto; bottom: 250px; width: auto; height: auto; display: flex; align-items: center; opacity: 0; }
      .label .bar { width: 10px; height: 64px; background: var(--gold); margin-right: 18px; border-radius: 3px; }
      .label .txt { font-size: 46px; font-weight: 900; text-shadow: 0 3px 12px rgba(0,0,0,.85); letter-spacing: .04em; }
      .label .txt small { font-size: 26px; font-weight: 500; color: var(--cream); margin-left: 16px; letter-spacing: .14em; }

      /* ---------- price poster ---------- */
      .poster { background: linear-gradient(90deg, rgba(8,20,60,.92) 0%, rgba(8,20,60,.82) 55%, rgba(8,20,60,.25) 100%); }
      .poster .top { position: absolute; left: 0; top: 0; width: 1920px; height: 96px; background: linear-gradient(90deg, var(--red2), var(--red) 50%, var(--red2)); border-bottom: 4px solid var(--gold); display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 900; color: var(--gold2); letter-spacing: .12em; opacity: 0; }
      .poster .h1 { position: absolute; left: 90px; top: 118px; font-size: 78px; font-weight: 900; letter-spacing: .02em; opacity: 0; white-space: nowrap; line-height: 1.15; }
      .poster .h1 .n { color: var(--gold2); font-size: 100px; }
      .poster .h2 { position: absolute; left: 96px; top: 228px; font-size: 34px; color: var(--cream); letter-spacing: .08em; opacity: 0; }
      .poster .h2 span { color: var(--gold); margin-right: 10px; }
      .poster .burst { position: absolute; left: 90px; top: 290px; width: 980px; display: flex; align-items: flex-end; gap: 26px; opacity: 0; }
      .poster .burst .lbl { font-size: 54px; font-weight: 900; color: #fff; background: var(--red); padding: 10px 26px; border-radius: 12px; line-height: 1.1; text-align: center; }
      .poster .burst .amt { font-size: 200px; font-weight: 900; line-height: .9; color: var(--gold2); text-shadow: 0 4px 0 #7a4b00, 0 14px 40px rgba(0,0,0,.8); letter-spacing: -.02em; }
      .poster .burst .amt small { font-size: 70px; }
      .poster .burst .from { font-size: 56px; font-weight: 900; color: #fff; padding-bottom: 20px; }
      .poster .incl { position: absolute; left: 96px; top: 525px; display: flex; gap: 16px; opacity: 0; }
      .poster .incl span { padding: 8px 22px; border: 2px solid var(--gold); border-radius: 999px; font-size: 30px; font-weight: 700; color: var(--gold2); background: rgba(0,0,0,.35); }
      .poster .note { position: absolute; left: 96px; top: 596px; font-size: 30px; color: var(--cream); letter-spacing: .06em; opacity: 0; }
      .poster .note b { color: var(--gold2); }
      .poster .cta { position: absolute; left: 90px; top: 650px; font-size: 54px; font-weight: 900; color: var(--gold2); letter-spacing: .08em; text-shadow: 0 3px 12px rgba(0,0,0,.8); opacity: 0; }
      .poster .phone { position: absolute; left: 90px; top: 728px; display: flex; align-items: center; gap: 24px; opacity: 0; }
      .poster .phone .ic { width: 84px; height: 84px; border-radius: 50%; background: var(--gold); display: flex; align-items: center; justify-content: center; font-size: 44px; color: var(--ink); box-shadow: 0 10px 30px rgba(0,0,0,.6); }
      .poster .phone .no { font-size: 100px; font-weight: 900; color: #fff; letter-spacing: .02em; text-shadow: 0 4px 0 var(--red2), 0 12px 30px rgba(0,0,0,.8); line-height: 1; }
      .poster .phone .site { font-size: 28px; color: var(--cream); letter-spacing: .14em; margin-top: 6px; }
      .poster .phone .site b { color: var(--gold2); }
      .poster .qr { position: absolute; left: 1000px; top: 712px; width: 170px; height: 170px; background: #fff; border-radius: 14px; padding: 10px; opacity: 0; box-shadow: 0 10px 30px rgba(0,0,0,.6); }
      .poster .qr img { width: 100%; height: 100%; object-fit: contain; }
      .poster .qr span { position: absolute; left: -20px; top: -34px; width: 210px; text-align: center; font-size: 20px; color: var(--cream); letter-spacing: .06em; white-space: nowrap; }
      .poster .host { position: absolute; right: 30px; bottom: 0; height: 840px; opacity: 0; }
      .poster .host img { height: 840px; filter: drop-shadow(0 20px 40px rgba(0,0,0,.6)); }

      /* ---------- subtitles ---------- */
      .sub { top: auto; bottom: 70px; left: 0; width: 1920px; height: auto; text-align: center; padding: 0 160px; opacity: 0; }
      .sub .chip { display: inline-block; background: var(--gold); color: var(--ink); font-size: 22px; font-weight: 900; padding: 4px 16px; border-radius: 6px; margin-bottom: 14px; letter-spacing: .1em; }
      .sub .txt { font-size: 58px; font-weight: 700; line-height: 1.3; text-shadow: 0 0 3px #000, 0 3px 14px rgba(0,0,0,.95), 0 0 24px rgba(0,0,0,.8); letter-spacing: .02em; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="tour-7622-promo" data-start="0" data-duration="__TOTAL__" data-width="1920" data-height="1080">
      <video id="plate" class="clip" src="assets/build/plate.mp4" muted playsinline preload="auto" data-start="0" data-duration="__TOTAL__" data-track-index="0"></video>
      <div id="vignette" class="clip vignette" data-start="0" data-duration="__TOTAL__" data-track-index="1"></div>
      <div id="overlays"></div>
      <!--__AUDIO__-->
    </div>

    <script>
      var DATA = /*__DATA__*/;
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var T = DATA.tour, root = document.getElementById("overlays");
      var FADE = DATA.fade;

      function el(cls, html, start, dur, track, id) {
        var d = document.createElement("div");
        d.className = "clip " + cls; d.innerHTML = html; d.id = id;
        d.setAttribute("data-start", start); d.setAttribute("data-duration", dur); d.setAttribute("data-track-index", track);
        root.appendChild(d); return d;
      }
      function pop(sel, t, opts) {
        opts = opts || {};
        tl.fromTo(sel, { opacity: 0, y: opts.y == null ? 40 : opts.y, x: opts.x || 0, scale: opts.scale || 1 },
                       { opacity: 1, y: 0, x: 0, scale: 1, duration: opts.d || 0.6, ease: opts.ease || "power3.out" }, t);
      }
      function fadeOut(sel, t, d) { tl.to(sel, { opacity: 0, duration: d || 0.4, ease: "power2.in" }, t); }

      var shots = DATA.shots;
      var subN = 0;
      shots.forEach(function (s, k) {
        var vis = s._vis, visEnd = s._vis_end, first = k === 0, last = k === shots.length - 1;
        var start = first ? 0 : s._offset, end = last ? DATA.total : visEnd + FADE;

        // brand chip top-left on every shot except the cover and the poster
        if (!first && s.overlay !== "price") {
          var b = el("brand", '<img src="assets/photos/logo_gold.png"><div><div class="t1">' + T.brand + '</div><div class="t2">XOTOURS.NET</div></div>', start, (end - start).toFixed(3), 20, "brand-" + s.id);
          tl.fromTo(b, { opacity: 0 }, { opacity: 1, duration: 0.5 }, vis - 0.2);
          fadeOut(b, visEnd, FADE);
        }

        if (s.overlay === "cover") {
          var c = el("cover", [
            '<div class="ribbon">' + T.anniversary.replace("32", "<b>32</b>") + ' ★ 特別企劃</div>',
            '<div class="h1 gold-text">' + T.title.replace("11", '<span class="n">11</span>') + '</div>',
            '<div class="h2"><span>搭乘</span>' + T.ship + '</div>',
            '<div class="pills"><span class="pill">尊榮全包 · 無憂慢遊</span><span class="pill">含洛杉磯往返機票</span><span class="pill">全程陽台艙</span></div>',
            '<div class="date"><b>' + T.depart + '</b>　限量出發</div>',
            '<div class="host"><img src="assets/presenter/presenter_cutout.png"><div class="tag">跟著曾老師<small>聚老友 · 遊英倫</small></div></div>'
          ].join(""), start, (end - start).toFixed(3), 10, "ov-" + s.id);
          pop("#ov-cover .ribbon", 0.2, { x: -60, y: 0 });
          pop("#ov-cover .h1", 0.5, { y: 50, d: 0.8 });
          pop("#ov-cover .h2", 0.9);
          pop("#ov-cover .pills", 1.2);
          pop("#ov-cover .date", 1.45);
          pop("#ov-cover .host", 0.7, { x: 80, y: 0, d: 0.9 });
          fadeOut("#ov-cover", visEnd, FADE);
        }
        if (s.overlay === "anniv") {
          el("anniv", '<div class="l1 gold-text">慶祝新聯華假期 32 週年！</div><div class="l2 stroke-red">英倫愛爾蘭大優惠！！</div>', start, (end - start).toFixed(3), 10, "ov-" + s.id);
          pop("#ov-" + s.id + " .l1", vis + 0.1, { scale: 0.7, y: 0, d: 0.7, ease: "back.out(1.6)" });
          pop("#ov-" + s.id + " .l2", vis + 0.8, { scale: 0.7, y: 0, d: 0.7, ease: "back.out(1.6)" });
          fadeOut("#ov-" + s.id, visEnd, FADE);
        }
        if (s.overlay === "includes") {
          el("includes", '<div class="row"><span class="inc">包機票</span><span class="inc">包船票</span><span class="inc">包陽台艙</span><span class="inc">包倫敦市內遊</span></div>' +
                         '<div class="price">只要 US<b class="num">$' + T.price + '</b>起</div>', start, (end - start).toFixed(3), 10, "ov-" + s.id);
          tl.fromTo("#ov-" + s.id + " .inc", { opacity: 0, scale: 0.6, y: 20 }, { opacity: 1, scale: 1, y: 0, duration: 0.5, stagger: 0.42, ease: "back.out(1.8)" }, vis + 0.2);
          pop("#ov-" + s.id + " .price", vis + 2.3, { scale: 0.6, y: 0, d: 0.7, ease: "back.out(1.6)" });
          fadeOut("#ov-" + s.id, visEnd, FADE);
        }
        if (s.label) {
          var parts = s.label.split(" "), zh = parts.shift(), en = parts.join(" ");
          el("label", '<div class="bar"></div><div class="txt">' + zh + '<small>' + en + '</small></div>', start, (end - start).toFixed(3), 12, "lb-" + s.id);
          pop("#lb-" + s.id, vis + 0.1, { x: -40, y: 0, d: 0.5 });
          fadeOut("#lb-" + s.id, visEnd - 0.1, 0.4);
        }
        if (s.overlay === "price" && (k === 0 || shots[k - 1].overlay !== "price")) {
          // one poster spanning the consecutive price/cta shots
          var j = k; while (j + 1 < shots.length && shots[j + 1].overlay === "price") j++;
          var pEnd = (j === shots.length - 1) ? DATA.total : shots[j]._vis_end + FADE;
          el("poster", [
            '<div class="top">' + T.anniversary + ' · ' + T.ship + '</div>',
            '<div class="h1 gold-text">' + T.title.replace("11", '<span class="n">11</span>') + '</div>',
            '<div class="h2"><span>搭乘</span>' + T.ship + '</div>',
            '<div class="burst"><div class="lbl">驚爆<br>價格盤</div><div class="amt num"><small>$</small>' + T.price + '</div><div class="from">起</div></div>',
            '<div class="incl"><span>包機票</span><span>包船票</span><span>包陽台艙</span><span>包稅金</span></div>',
            '<div class="note">雙人同房每位 · <b>' + T.depart + '</b> · 免付費 ' + T.tollfree + '</div>',
            '<div class="cta">名額有限 · 立即行動！</div>',
            '<div class="phone"><div class="ic">☎</div><div><div class="no num">' + T.phone + '</div><div class="site">官方網站 <b>' + T.site + '</b></div></div></div>',
            '<div class="qr"><img src="assets/presenter/qrcode.png"><span>手機掃描 · 線上報名</span></div>',
            '<div class="host"><img src="assets/presenter/presenter_cutout.png"></div>'
          ].join(""), start, (pEnd - start).toFixed(3), 10, "ov-" + s.id);
          var p = "#ov-" + s.id + " ";
          pop(p + ".top", vis, { y: -60, d: 0.5 });
          pop(p + ".host", vis + 0.1, { x: 120, y: 0, d: 0.8 });
          pop(p + ".h1", vis + 0.3, { y: 40 });
          pop(p + ".h2", vis + 0.55);
          pop(p + ".burst", vis + 0.9, { scale: 0.5, y: 0, d: 0.8, ease: "back.out(1.7)" });
          pop(p + ".incl", vis + 1.4);
          pop(p + ".note", vis + 1.6);
          pop(p + ".cta", vis + 2.0, { scale: 0.7, y: 0, ease: "back.out(1.6)" });
          pop(p + ".phone", vis + 2.4, { y: 40, d: 0.7 });
          pop(p + ".qr", vis + 2.7, { scale: 0.6, y: 0 });
          tl.to(p + ".cta", { scale: 1.06, duration: 0.6, yoyo: true, repeat: Math.max(0, Math.floor((pEnd - vis - 3) / 0.6) - 1), ease: "sine.inOut" }, vis + 3);
          if (j === shots.length - 1) fadeOut(p, DATA.total - 1.0, 1.0);
        }

        if (s.vo) {
          var subStart = s._vo_start - 0.1, subEnd = Math.min(s._vo_start + s._vo_dur + 0.5, end);
          el("sub", '<div class="chip">' + T.brand.split(" ")[0] + '</div><div class="txt">' + s.sub + '</div>', subStart.toFixed(3), (subEnd - subStart).toFixed(3), 25, "sub-" + s.id);
          tl.fromTo("#sub-" + s.id, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, subStart);
          fadeOut("#sub-" + s.id, subEnd - 0.3, 0.3);
          subN++;
        }
      });

      window.__timelines["tour-7622-promo"] = tl;
    </script>
  </body>
</html>
