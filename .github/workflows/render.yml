name: render

# Renders the tour 7622 promotion video on a GitHub-hosted runner:
#   OmniVoice (k2-fsa/OmniVoice, CPU) narrates script.json in the cloned presenter voice
#   -> ffmpeg cuts the AI clips and brochure stills into a 1080p plate
#   -> HyperFrames renders the overlays, subtitles and audio mix to MP4
#   -> the MP4 is attached to a release tagged run-<number> and uploaded as an artifact.

on:
  push:
    branches: [main]
    paths: [script.json, build.py, voice_tool.py, tpl/**, assets/**, voice/**, .github/workflows/render.yml]
  workflow_dispatch:
    inputs:
      quality:
        description: HyperFrames encode quality
        type: choice
        options: [draft, standard, high]
        default: high
      voice:
        description: clone = presenter voice (needs the VOICE_KEY secret), design = OmniVoice voice design, auto = clone when the key is present
        type: choice
        options: [auto, clone, design]
        default: auto
      force_tts:
        description: ignore the cached narration and synthesize again
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      QUALITY: ${{ inputs.quality || 'high' }}
      VOICE: ${{ inputs.voice || 'auto' }}
      PYTHONUTF8: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4

      - name: system packages (ffmpeg, CJK fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk fonts-noto-cjk-extra
          fc-list | grep -ci "noto sans cjk" || true
          ffmpeg -version | head -1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/workflows/render.yml

      - name: python packages (CPU torch + OmniVoice)
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q omnivoice soundfile
          python -c "import torch, omnivoice; print('torch', torch.__version__, 'omnivoice', getattr(omnivoice, '__version__', '?'))"

      - name: cache the OmniVoice checkpoint (~3.3 GB)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-omnivoice-v1
          restore-keys: hf-omnivoice-

      - name: cache the synthesized narration
        if: ${{ !inputs.force_tts }}
        uses: actions/cache@v4
        with:
          path: assets/vo
          key: vo-${{ env.VOICE }}-${{ hashFiles('script.json', 'voice/**') }}

      - name: decrypt the presenter voice reference (needs the VOICE_KEY secret)
        if: env.VOICE != 'design'
        env:
          VOICE_KEY: ${{ secrets.VOICE_KEY }}
        run: python voice_tool.py decrypt

      - name: narration (OmniVoice)
        run: |
          if [ "${{ inputs.force_tts }}" = "true" ]; then F=--force; else F=; fi
          python build.py tts --voice "$VOICE" $F

      - name: plate + composition
        run: |
          python build.py plate compose
          ls -la assets/build index.html

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: lint the composition
        run: npx --yes hyperframes@0.5.1 lint

      - name: render (HyperFrames)
        run: |
          npx --yes hyperframes@0.5.1 render -q "$QUALITY" -w 2 -o out/tour_7622_promo.mp4 2>&1 | grep -vE "^\s*$" | tail -60
          ffprobe -v error -show_entries format=duration:stream=codec_type,width,height -of compact out/tour_7622_promo.mp4

      - name: contact sheet for a quick visual check
        run: ffmpeg -v error -y -i out/tour_7622_promo.mp4 -vf "fps=1/3,scale=384:-1,tile=5x5" out/contact_sheet.jpg

      - uses: actions/upload-artifact@v4
        with:
          name: tour_7622_promo
          path: |
            out/tour_7622_promo.mp4
            out/contact_sheet.jpg
            timing.json

      - name: attach the MP4 to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="run-${{ github.run_number }}"
          gh release create "$tag" out/tour_7622_promo.mp4 out/contact_sheet.jpg timing.json \
            --repo "$GITHUB_REPOSITORY" --title "Tour 7622 promo $tag" \
            --notes "quality=$QUALITY voice=$VOICE commit=${{ github.sha }}"
